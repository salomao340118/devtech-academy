<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DevTech Academy</title>
</head>
<body>
  <h1>DevTech Academy - Alunos</h1>

  <!-- Formulário de cadastro de alunos -->
  <form id="form-aluno">

    <!-- Nome: só letras (com acento), espaços, hífen e apóstrofo -->
    <label>Nome:
      <input type="text" id="nome" required
             pattern="^\p{L}+([ '\-]\p{L}+)*$"
             title="Use apenas letras, sem números ou símbolos">
    </label><br><br>

    <!-- Idade: inteiro de 1 a 120 -->
    <label>Idade:
      <input type="number" id="idade" min="1" max="120" step="1" required>
    </label><br><br>

    <!-- Curso: opções do enunciado -->
    <label>Curso:
      <select id="curso">
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
      </select>
    </label><br><br>

    <!-- Nota final: de 0 a 10 -->
    <label>Nota Final:
      <input type="number" id="nota" min="0" max="10" step="0.1" required>
    </label><br><br>

    <button type="button" id="btn-salvar" onclick="salvarAluno()">Cadastrar</button>
  </form>

  <h2>Alunos cadastrados</h2>

  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <!-- >>> MUDANÇA (Exercício 2): nova coluna "Situação" no cabeçalho -->
        <th>Nome</th><th>Idade</th><th>Curso</th><th>Nota Final</th><th>Situação</th><th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-alunos"></tbody>
  </table>

  <!-- >>> MUDANÇA (Exercício 2): novo script aluno.js, que precisa vir ANTES do script.js -->
  <script src="aluno.js"></script>
  <script src="script.js"></script>
</body>
</html>
