<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>DevTech Academy</title>

  <!-- >>> MUDANÇA (Bootstrap): CSS do Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- >>> MUDANÇA (Bootstrap): bg-body-tertiary = fundo adaptável ao tema claro/escuro -->
<body class="bg-body-tertiary">

  <!-- >>> MUDANÇA (Bootstrap): container centraliza o conteúdo; py-4 = espaçamento vertical -->
  <div class="container py-4">

    <!-- Cabeçalho com o título à esquerda e o botão de tema à direita -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">DevTech Academy - Alunos</h1>
      <button id="btn-tema" class="btn btn-outline-secondary">
          Modo Escuro
      </button>
    </div>

    <!-- >>> MUDANÇA (Bootstrap): o formulário agora fica dentro de um "card" -->
    <div class="card shadow-sm mb-4">
      <div class="card-header">Cadastro de aluno</div>
      <div class="card-body">

        <form id="form-aluno">
          <!-- row + col-md-*: grade responsiva (2 colunas no computador, 1 no celular) -->
          <div class="row g-3">

            <!-- Nome: só letras, espaços, hífen e apóstrofo -->
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required maxlength="100"
                     pattern="^\p{L}+([ '\-]\p{L}+)*$"
                     title="Use apenas letras, sem números ou símbolos">
            </div>

            <!-- Idade: inteiro de 1 a 120 -->
            <div class="col-md-6">
              <label for="idade" class="form-label">Idade</label>
              <input type="number" class="form-control" id="idade" min="1" max="120" step="1" required>
            </div>

            <!-- Curso: form-select é a classe do Bootstrap para <select> -->
            <div class="col-md-6">
              <label for="curso" class="form-label">Curso</label>
              <select class="form-select" id="curso">
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
              </select>
            </div>

            <!-- Nota final: de 0 a 10 -->
            <div class="col-md-6">
              <label for="nota" class="form-label">Nota Final</label>
              <input type="number" class="form-control" id="nota" min="0" max="10" step="0.1" required>
            </div>

            <div class="col-12">
              <!-- btn btn-primary = botão azul do Bootstrap -->
              <button type="button" id="btn-salvar" class="btn btn-primary">Cadastrar</button>
            </div>
          </div>
        </form>

      </div>
    </div>

    <h2 class="h4">Alunos cadastrados</h2>

    <!-- >>> MUDANÇA (Bootstrap): removida a classe "bg-white" para a tabela acompanhar o tema -->
    <div class="table-responsive mb-4">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>Nome</th><th>Idade</th><th>Curso</th><th>Nota Final</th><th>Situação</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-alunos"></tbody>
      </table>
    </div>

    <!-- Seção de relatórios: cada botão gera um relatório -->
    <h2 class="h4">Relatórios</h2>

    <!-- >>> MUDANÇA (Bootstrap): d-flex flex-wrap gap-2 = botões lado a lado, quebrando de linha se faltar espaço -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="btn-aprovados" class="btn btn-outline-primary">Alunos aprovados</button>
      <button id="btn-media-notas" class="btn btn-outline-primary">Média das notas</button>
      <button id="btn-media-idades" class="btn btn-outline-primary">Média das idades</button>
      <button id="btn-ordem-alfabetica" class="btn btn-outline-primary">Nomes em ordem alfabética</button>
      <button id="btn-por-curso" class="btn btn-outline-primary">Alunos por curso</button>
    </div>

    <!-- Área onde o resultado do relatório é exibido -->
    <div id="resultado-relatorio"></div>

  </div>

  <!-- >>> MUDANÇA (Bootstrap): JavaScript do Bootstrap (inclui o Popper), antes dos nossos scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

  <!-- aluno.js precisa vir ANTES do script.js -->
  <script src="aluno.js"></script>
  <script src="script.js"></script>
</body>
</html>
