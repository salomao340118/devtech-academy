# Define os "serviços" (containers) do projeto
services:
  web:
    # Imagem oficial do Nginx, versão enxuta (alpine)
    image: nginx:alpine
    # Nome fácil de achar no Docker Desktop e nos comandos
    container_name: devtech-academy
    # Porta-do-seu-PC:porta-do-container -> acesse em http://localhost:8080
    ports:
      - "8080:80"
    # Espelha a pasta ./src do seu PC na pasta que o Nginx serve.
    # ":ro" = somente leitura dentro do container (mais seguro).
    volumes:
      - ./src:/usr/share/nginx/html:ro